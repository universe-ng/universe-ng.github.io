<script type="text/javascript">
  async function handleDeepLinkAndRedirect() {
    const path = window.location.pathname;
    const userAgent = navigator.userAgent || navigator.vendor || window.opera;
    const packageName = "com.batako.universe";

    // CHECK 1: Only run for Deep Links
    const isDeepLink = path.includes('/post/') || 
                       path.includes('/profile/') || 
                       path.includes('/channel/');

    if (isDeepLink) {
      // 🚀 NEW: Save the path to clipboard so the app can read it after install
      try {
        await navigator.clipboard.writeText("universe_path:" + path);
      } catch (err) {
        console.log("Clipboard skip"); // Some browsers might block this, but it's okay
      }

      // If Android, try to open App or Store
      if (/android/i.test(userAgent)) {
        const intentUrl = "intent://" + window.location.host + path + 
                        "#Intent;scheme=https;package=" + packageName + 
                        ";S.browser_fallback_url=" + 
                        encodeURIComponent("https://play.google.com/store/apps/details?id=" + packageName) + 
                        ";end";
        
        window.location.href = intentUrl;
        return;
      }
    }

    // Fallback to Home
    window.location.href = "/";
  }

  handleDeepLinkAndRedirect();
</script>

  handleDeepLinkAndRedirect();
